<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- start the big Earth textures downloading alongside the JS instead of after it -->
    <link rel="preload" as="image" href="/textures/earth_day.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/textures/earth_clouds.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/textures/earth_night.webp" crossorigin="anonymous" />
    <title>Zoomverse — from Earth to the edge of the universe</title>
  </head>
  <body>
    <!-- static copy of the intro, painted before any JS loads; React takes over seamlessly (src/ui/Intro.tsx) -->
    <div id="root"><div><section class="intro" aria-label="Welcome">
      <p class="eyebrow">Zoomverse</p>
      <h1>The universe,<br />to scale.</h1>
      <p class="lede">Fly from your doorstep to the edge of everything we can see. Real planets, real stars, and the satellites passing over you right now.</p>
      <div class="ctas"><button class="primary">Take the tour</button><button class="link">Start exploring</button></div>
    </section></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
