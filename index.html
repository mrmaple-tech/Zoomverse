<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- start the big Earth textures downloading alongside the JS instead of after it -->
    <link rel="preload" as="image" href="/textures/earth_day.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/textures/earth_clouds.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/textures/earth_night.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/textures/earth_spec.webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/textures/earth_normal.webp" crossorigin="anonymous" />
    <!-- paint space-black on the very first frame, before any CSS or JS arrives -->
    <style>html,body{background:#020308;margin:0}</style>
    <title>Zoomverse — from Earth to the edge of the universe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
